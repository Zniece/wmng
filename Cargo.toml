[package]
name = "wmng"
version = "0.1.0"
edition = "2021"
description = "UNIX-style Windows management applets"
license = "MIT"

# The lib target (model/) is platform-independent and must stay free of any
# Win32 dependency: its tests run on WSL. Only the bin target may use
# windows-sys, and only through providers/.
[lib]
name = "wmng_model"
path = "src/lib.rs"

[[bin]]
name = "wmng"
path = "src/main.rs"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Shutdown",
]
